name: Python Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install dev deps
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Lint
      run: flake8 macos tests
    - name: Type-check
      run: mypy macos

  # The live tests talk to the real system (NSWorkspace, the Keychain, the
  # pasteboard, screencapture), so the Python-version sweep runs on macOS.
  test-macos:
    needs: lint
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Test with pytest
      # --cov-fail-under is the real coverage gate: deterministic and
      # independent of any external service. Codecov (below) only reports.
      # Locally the suite covers ~88%; runners skip a few live tests (e.g. no
      # battery), so the floor leaves headroom.
      run: pytest tests -v --cov=macos --cov-report=term --cov-report=xml --cov-fail-under=75
    - name: Upload coverage to Codecov
      # Informational only (see codecov.yml): a flaky upload never fails the
      # job. Runs even when tests fail, so partial coverage stays visible.
      if: always()
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        flags: macOS-py${{ matrix.python-version }}
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  # The package must import anywhere and fail with NotSupportedError, so the
  # unit tests also run on Linux (the live ones skip themselves there).
  test-linux:
    needs: lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Test with pytest
      # No gate here: outside macOS only the platform guards run, which is
      # what this job checks. The upload shows that code path in Codecov.
      run: pytest tests -v --cov=macos --cov-report=term --cov-report=xml
    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        flags: Linux-py3.12
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  # Warnings (including broken cross-references, via -n) fail the build, the
  # same as on Read the Docs.
  docs:
    needs: lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Install docs dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/requirements.txt
        pip install -e .
    - name: Build docs
      run: python -m sphinx -n -W --keep-going -b html docs docs/_build/html
