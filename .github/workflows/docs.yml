name: Docs

# The documentation builds without warnings. The job's name, docs, is a
# required check on main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Warnings (including broken cross-references, via -n) fail the build, the
  # same as on Read the Docs.
  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Install docs dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/requirements.txt
        pip install -e .
    - name: Build docs
      run: python -m sphinx -n -W --keep-going -b html docs docs/_build/html
